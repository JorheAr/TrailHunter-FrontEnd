<div class="flex justify-center items-start min-h-screen bg-white py-12 px-4 sm:px-6 lg:px-20">
  <div class="w-full max-w-4xl space-y-8">

    <!-- Título -->
    <h2 class="text-3xl font-bold text-gray-800 text-center">Explorar</h2>

    <!-- Buscador + Filtros -->
    <div class="flex items-stretch gap-2">
      <input
        type="text"
        pInputText
        placeholder="Buscar..."
        [(ngModel)]="searchQuery"
        class="flex-1 h-[48px] p-3 rounded-lg border border-gray-300 focus:border-green-500 focus:outline-none"
      />

      <button
        pButton
        icon="pi pi-filter"
        label="Filtros"
        #filterBtn
        (click)="filterPanel.toggle($event)"
        class="h-[48px] px-4 rounded-lg border border-gray-400 text-gray-700 whitespace-nowrap"
      ></button>
    </div>

    <!-- Panel de filtros -->
    <p-overlayPanel #filterPanel [dismissable]="true" [showCloseIcon]="true">
      <div class="space-y-4 w-[250px]">

        <!-- Filtro: Categoría -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
          <p-select
            [options]="categorias"
            [(ngModel)]="selectedCategoria"
            placeholder="Selecciona una categoría"
            class="w-full"
          ></p-select>
        </div>

        <!-- Filtro: Fecha -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha</label>
          <p-datepicker
            [(ngModel)]="selectedFecha"
            dateFormat="dd/mm/yy"
            placeholder="Selecciona una fecha"
            showIcon="true"
            class="w-full"
          ></p-datepicker>
        </div>

        <button pButton label="Aplicar filtros" (click)="filterPanel.hide(); aplicarFiltros()" class="w-full"></button>
      </div>
    </p-overlayPanel>

    <!-- Tabs -->
    <div class="flex justify-center gap-6 border-b border-gray-300 mb-6">
      <button
        (click)="selectedTab = 'usuarios'; onUsuariosTabActivado()"
        [ngClass]="{
          'border-green-500 text-green-500': selectedTab === 'usuarios',
          'border-transparent text-gray-500': selectedTab !== 'usuarios'
        }"
        class="border-b-2 px-4 py-2 font-semibold focus:outline-none"
      >
        Usuarios
      </button>
      <button
        (click)="selectedTab = 'actividades'"
        [ngClass]="{
          'border-green-500 text-green-500': selectedTab === 'actividades',
          'border-transparent text-gray-500': selectedTab !== 'actividades'
        }"
        class="border-b-2 px-4 py-2 font-semibold focus:outline-none"
      >
        Actividades
      </button>
      <button
        (click)="selectedTab = 'grupos'"
        [ngClass]="{
          'border-green-500 text-green-500': selectedTab === 'grupos',
          'border-transparent text-gray-500': selectedTab !== 'grupos'
        }"
        class="border-b-2 px-4 py-2 font-semibold focus:outline-none"
      >
        Grupos
      </button>
    </div>

    <!-- Contenido por pestaña -->
    <ng-container [ngSwitch]="selectedTab">

      <app-buscar-usuarios *ngSwitchCase="'usuarios'" [query]="searchQuery"></app-buscar-usuarios>

      <app-buscar-actividades
        *ngSwitchCase="'actividades'"
        [query]="searchQuery"
        [categoria]="selectedCategoria"
        [fecha]="selectedFecha"
      >
      </app-buscar-actividades>

      <app-buscar-grupos *ngSwitchCase="'grupos'" [query]="searchQuery"></app-buscar-grupos>

    </ng-container>
  </div>
</div>
