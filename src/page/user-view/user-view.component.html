<div class="bg-white h-full w-full p-5 flex flex-col items-center justify-start">
  <app-loader *ngIf="cargando"></app-loader>

  <!-- Siempre se muestra la información principal del usuario -->
  <div class="flex flex-col gap-6 md:w-2/3 mx-auto w-full" *ngIf="!cargando && usuario">
    <!-- Info principal (siempre visible, sin importar si está bloqueado o te bloquea) -->
    <div class="flex flex-col md:flex-row items-center gap-10">
      <!-- Avatar de Usuario -->
      <div class="flex justify-center items-center mb-4 md:mb-0">
        <img
          [src]="avatarUrl"
          class="w-34 h-34 rounded-full border-4 border-gray-300"
          alt="Avatar de Usuario"
        />
      </div>

      <!-- Nombre + Estadísticas -->
      <div class="flex flex-col items-center gap-4 text-center">
        <!-- Nombre del usuario -->
        <h2 class="text-2xl md:text-xl sm:text-start w-full font-bold text-gray-800">{{ usuario.username }}</h2>

        <!-- Estadísticas centradas -->
        <div class="flex gap-10">
          <div class="flex flex-col items-center gap-2">
            <label class="text-sm sm:text-xl">Seguidores</label>
            <label class="text-xl sm:text-3xl font-semibold">{{ seguidores }}</label>
          </div>
          <div class="flex flex-col items-center gap-2">
            <label class="text-sm sm:text-xl">Seguidos</label>
            <label class="text-xl sm:text-3xl font-semibold">{{ seguidos }}</label>
          </div>
          <div class="flex flex-col items-center gap-2">
            <label class="text-sm sm:text-xl">Publicaciones</label>
            <label class="text-xl sm:text-3xl font-semibold">0</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Mostrar los botones de "Seguir/Dejar de seguir" y "Bloquear/Desbloquear" siempre -->
    <div class="flex flex-col gap-3">
      <!-- Botón seguir/dejar de seguir -->
      <div
        class="rounded-lg bg-gray-100 p-2 justify-center flex items-center gap-3 cursor-pointer hover:bg-gray-200 transition self-start w-full sm:w-[240px]"
        (click)="usuario.is_following ? dejarDeSeguirUsuario() : seguirUsuario()"
      >
        <i class="pi" [ngClass]="usuario.is_following ? 'pi-user-minus' : 'pi-user-plus'"></i>
        <label class="text-gray-800 font-medium">
          {{ usuario.is_following ? 'Dejar de seguir' : 'Seguir' }}
        </label>
      </div>

      <!-- Botón bloquear/desbloquear -->
      <div
        class="rounded-lg p-2 justify-center flex items-center gap-3 cursor-pointer transition self-start w-full sm:w-[240px]"
        [ngClass]="usuario.is_blocked ? 'bg-green-100 hover:bg-green-200' : 'bg-red-100 hover:bg-red-200'"
        (click)="usuario.is_blocked ? desbloquearUsuario() : bloquearUsuario()"
      >
        <i class="pi" [ngClass]="usuario.is_blocked ? 'pi-lock-open text-green-600' : 'pi-ban text-red-600'"></i>
        <label
          [ngClass]="usuario.is_blocked ? 'text-green-700' : 'text-red-700'"
          class="font-medium"
        >
          {{ usuario.is_blocked ? 'Desbloquear usuario' : 'Bloquear usuario' }}
        </label>
      </div>
    </div>

    <!-- Mostrar mensaje si el usuario está bloqueado o te bloquea -->
    <div *ngIf="usuario.is_blocked || isBlockedByUser()">
      <div class="flex p-2 pt-5">
        <h1 class="text-xl font-semibold text-center sm:text-start">
          {{ usuario.is_blocked ? 'No se puede mostrar la información de este perfil porque lo tienes bloqueado.' : 'No se puede mostrar la información de este perfil porque te tiene bloqueado.' }}
        </h1>
      </div>
    </div>

    <!-- Solo mostrar estadísticas o publicaciones si no estás bloqueado o si no te bloquea -->
    <div class="flex p-2 border-b-1 border-gray-200 md:w-full" *ngIf="!usuario.is_blocked && !isBlockedByUser()">
      <h1 class="text-2xl font-semibold">Publicaciones</h1>
    </div>

    <div class="flex p-2 border-b-1 border-gray-200 md:w-full" *ngIf="!usuario.is_blocked && !isBlockedByUser()">
      <h1 class="text-2xl font-semibold">Actividades</h1>
    </div>
  </div>

</div>
